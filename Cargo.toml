[package]
name = "prometheus-nut-exporter"
version = "0.0.0"
authors = ["ShlomiD83", "HON95"]
license = "GPL-3.0-only"
description = "A Prometheus exporter for Network UPS Tools (NUT)."
keywords = ["prometheus", "openmetrics", "nut", "exporter"]
repository = "https://github.com/ShlomiD83/nut-exporter"
edition = "2021"
rust-version = "1.85"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
hyper = { version = "1.11", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
form_urlencoded = "1.2"
regex = "1.13"
log = "0.4"
env_logger = "0.11"

[profile.release]
# Small static binary: strip all symbols, whole-program LTO, single codegen unit
strip = true
lto = true
codegen-units = 1
