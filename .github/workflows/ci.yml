name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}
  # Called by the weekly CVE check (cve-check.yml) to test, rebuild and publish the image
  workflow_call:
    inputs:
      publish:
        description: Build and publish the image
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  DOCKER_REPO: romekd/prometheus-nut-exporter
  DOCKER_USERNAME: romekd
  GHCR_REPO: ghcr.io/shlomid83/nut-exporter
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - name: Generate lockfile if missing
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Build
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      - name: Check code (clippy + style)
        run: manage/check.sh

      - name: Run integration test
        run: manage/integration_test.sh

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit (RustSec / CVE database)
        run: cargo audit --deny warnings

      - name: Dependency report
        if: always()
        run: |
          # --color never: the summary is Markdown, terminal color codes would show up as garbage
          {
            echo "## Direct dependencies"
            echo '```'
            cargo tree --depth 1 --color never
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock

  docker:
    needs: check
    # When called from the scheduled CVE check, only build when asked to publish
    if: github.event_name != 'schedule' || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download lockfile
        uses: actions/download-artifact@v8
        with:
          name: cargo-lock

      - name: Decide whether to build and publish
        id: meta
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"

          # Only files that end up in the image trigger a new image.
          # Manual runs (workflow_dispatch) always rebuild; PRs always test the build.
          IMAGE_CHANGED=true
          if [[ "$EVENT" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" HEAD | grep -qE '^(src/|Cargo\.(toml|lock)$|Dockerfile$)'; then
              IMAGE_CHANGED=true
            else
              IMAGE_CHANGED=false
            fi
          fi

          ON_MAIN=false
          if [[ "$HAS_TOKEN" == "true" && "$IS_DEFAULT_BRANCH" == "true" && "$EVENT" != "pull_request" ]]; then
            ON_MAIN=true
          fi
          PUBLISH=false
          if [[ "$ON_MAIN" == "true" && "$IMAGE_CHANGED" == "true" ]]; then
            PUBLISH=true
          fi

          {
            echo "date=$DATE"
            echo "build=$IMAGE_CHANGED"
            echo "on_main=$ON_MAIN"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Image inputs changed: $IMAGE_CHANGED"
            echo "Publish to Docker Hub and GHCR: $PUBLISH (tags: latest, $DATE)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on default branch)
        if: steps.meta.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORMS }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.date }}
          tags: |
            ${{ env.DOCKER_REPO }}:latest
            ${{ env.DOCKER_REPO }}:${{ steps.meta.outputs.date }}
            ${{ env.GHCR_REPO }}:latest
            ${{ env.GHCR_REPO }}:${{ steps.meta.outputs.date }}
          # Links the GHCR package to this repo and fills in its description
          labels: |
            org.opencontainers.image.title=Prometheus NUT Exporter
            org.opencontainers.image.description=Prometheus exporter for Network UPS Tools (NUT), based on HON95's project.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=Prometheus exporter for Network UPS Tools (NUT), based on HON95's project.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=GPL-3.0-only
          push: ${{ steps.meta.outputs.publish == 'true' }}

      - name: Sync README to Docker Hub description
        if: steps.meta.outputs.on_main == 'true'
        # Requires a Docker Hub token with Read, Write, Delete scope; don't fail the release over it.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_REPO }}
          short-description: "Minimal amd64/arm64 Prometheus exporter for Network UPS Tools (NUT), based on HON95's project."
          readme-filepath: ./README.md
          enable-url-completion: true
