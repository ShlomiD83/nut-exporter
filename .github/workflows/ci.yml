name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Weekly security audit of dependencies (does not publish an image)
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  DOCKER_REPO: romekd/prometheus-nut-exporter
  DOCKER_USERNAME: romekd
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - name: Generate lockfile if missing
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Build
        run: cargo build --locked

      - name: Check code (clippy + style)
        run: manage/check.sh

      - name: Run integration test
        run: manage/integration_test.sh

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit (RustSec / CVE database)
        run: cargo audit --deny warnings

      - name: Dependency report
        if: always()
        run: |
          echo "## Direct dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo tree --depth 1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock

  docker:
    needs: check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download lockfile
        uses: actions/download-artifact@v8
        with:
          name: cargo-lock

      - name: Decide whether to build and publish
        id: meta
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # Only files that end up in the image trigger a new image.
          # Manual runs (workflow_dispatch) always rebuild; PRs always test the build.
          IMAGE_CHANGED=true
          if [[ "$EVENT" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" HEAD | grep -qE '^(src/|Cargo\.(toml|lock)$|Dockerfile$)'; then
              IMAGE_CHANGED=true
            else
              IMAGE_CHANGED=false
            fi
          fi

          ON_MAIN=false
          if [[ "$HAS_TOKEN" == "true" && "$IS_DEFAULT_BRANCH" == "true" && "$EVENT" != "pull_request" ]]; then
            ON_MAIN=true
          fi
          PUBLISH=false
          if [[ "$ON_MAIN" == "true" && "$IMAGE_CHANGED" == "true" ]]; then
            PUBLISH=true
          fi

          echo "build=$IMAGE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "on_main=$ON_MAIN" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          {
            echo "Image inputs changed: $IMAGE_CHANGED"
            echo "Publish to Docker Hub: $PUBLISH (tags: latest, $DATE)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on default branch)
        if: steps.meta.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORMS }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.date }}
          tags: |
            ${{ env.DOCKER_REPO }}:latest
            ${{ env.DOCKER_REPO }}:${{ steps.meta.outputs.date }}
          push: ${{ steps.meta.outputs.publish == 'true' }}

      - name: Sync README to Docker Hub description
        if: steps.meta.outputs.on_main == 'true'
        # Requires a Docker Hub token with Read, Write, Delete scope; don't fail the release over it.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_REPO }}
          short-description: "Minimal amd64/arm64 Prometheus exporter for Network UPS Tools (NUT), based on HON95's project."
          readme-filepath: ./README.md
          enable-url-completion: true
