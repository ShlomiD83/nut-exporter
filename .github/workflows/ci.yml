name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Weekly security audit of dependencies (does not publish an image)
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  DOCKER_REPO: romekd/prometheus-nut-exporter
  DOCKER_USERNAME: romekd
  DOCKER_PLATFORMS: linux/arm64

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - name: Generate lockfile if missing
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Build
        run: cargo build --locked

      - name: Check code (clippy + style)
        run: manage/check.sh

      - name: Run integration test
        run: manage/integration_test.sh

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit (RustSec / CVE database)
        run: cargo audit --deny warnings

      - name: Dependency report
        if: always()
        run: |
          echo "## Direct dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo tree --depth 1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

  docker:
    needs: check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download lockfile
        uses: actions/download-artifact@v4
        with:
          name: cargo-lock

      - name: Decide whether to publish
        id: meta
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          PUBLISH=false
          if [[ "$HAS_TOKEN" == "true" && "${{ github.ref }}" == "refs/heads/${{ github.event.repository.default_branch }}" && "${{ github.event_name }}" != "pull_request" ]]; then
            PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Publish to Docker Hub: $PUBLISH (tags: latest, $DATE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on default branch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORMS }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.date }}
          tags: |
            ${{ env.DOCKER_REPO }}:latest
            ${{ env.DOCKER_REPO }}:${{ steps.meta.outputs.date }}
          push: ${{ steps.meta.outputs.publish == 'true' }}
