version: 2
# One grouped PR per ecosystem per week. PRs are NOT merged automatically: CI runs on each one and
# the assignee gets a GitHub notification to review and merge it (merging to main publishes a new image).
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    assignees: ["ShlomiD83"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: ["ShlomiD83"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    assignees: ["ShlomiD83"]
    groups:
      docker:
        patterns: ["*"]
